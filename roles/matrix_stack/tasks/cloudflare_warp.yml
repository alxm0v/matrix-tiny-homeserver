---
- name: Download Cloudflare WARP GPG key
  shell: curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

- name: Add Cloudflare WARP APT repository
  shell: echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ {{ ansible_distribution_release | default('$(lsb_release -cs)') }} main" | tee /etc/apt/sources.list.d/cloudflare-client.list
  args:
    creates: /etc/apt/sources.list.d/cloudflare-client.list

- name: Install cloudflare-warp package
  apt:
    name: cloudflare-warp
    state: present
    update_cache: yes

- name: Start and enable warp-svc systemd service
  systemd:
    name: warp-svc
    enabled: yes
    state: started

- name: Check WARP status
  command: warp-cli --accept-tos status
  register: warp_status
  ignore_errors: true
  changed_when: false

- name: Register WARP
  command: warp-cli --accept-tos registration new
  when: "warp_status.rc != 0 or 'Registration Missing' in warp_status.stdout or 'Not registered' in warp_status.stdout or 'Missing registration' in warp_status.stdout"

- name: Configure WARP proxy mode
  command: warp-cli --accept-tos mode proxy
  changed_when: false

- name: Set WARP proxy port
  command: warp-cli --accept-tos proxy port 40000
  changed_when: false
  ignore_errors: true # In case the proxy command syntax changed in newer versions

- name: Connect WARP
  command: warp-cli --accept-tos connect
  changed_when: false
