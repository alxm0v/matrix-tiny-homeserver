---
# Firewall rules definition
# These ports will be allowed in UFW after a reset
ufw_rules:
  - port: 22
    proto: tcp
    comment: "SSH"
  - port: 80
    proto: tcp
    comment: "HTTP (Traefik)"
  - port: 443
    proto: tcp
    comment: "HTTPS (Traefik)"
  - port: 3478
    proto: udp
    comment: "LiveKit TURN (UDP)"
  - port: 3478
    proto: tcp
    comment: "LiveKit TURN (TCP)"
  - port: 50000:50200
    proto: udp
    comment: "LiveKit Media (RTC)"
  - port: 30000:40000
    proto: udp
    comment: "LiveKit TURN relay"
  - port: 7880
    proto: tcp
    comment: "LiveKit API/Signaling"
  - port: 7881
    proto: tcp
    comment: "LiveKit ICE-over-TCP"
